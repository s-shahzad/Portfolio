name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  # Guard for the #1 deploy gotcha: the site serves styles.min.css / script.min.js,
  # not source. This job rebuilds both with the pinned esbuild and fails if the
  # committed .min files do not match the committed source.
  verify-min:
    # NAME IS A CONTRACT - do not decorate it. Branch protection on main lists
    # the required context as exactly "Min files fresh". This job was named
    # "Min files fresh (required)", so the context protection waited for never
    # appeared, the combined status sat at pending/total=0, and EVERY pull
    # request was permanently unmergeable regardless of whether CI passed.
    # The "(required)" suffix was a human hint that silently disabled the gate
    # it was hinting about. If you rename this job, update the required-status-
    # checks list on main in the same change.
    name: Min files fresh
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24.14.0"
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Rebuild minified assets
        run: npm run build

      - name: Fail if committed min files are stale
        run: |
          if ! git diff --exit-code -- styles.min.css script.min.js; then
            echo '::error::styles.min.css / script.min.js are STALE versus source.'
            echo 'Fix locally: npm run build, bump the ?v= cache stamps in index.html,'
            echo 'then git add the regenerated .min files together with the source change.'
            exit 1
          fi

  # Cheap deterministic checks. These can actually fail the build.
  static-checks:
    # NAME IS A CONTRACT - see the note on verify-min above. Protection lists
    # this context as exactly "Static checks".
    name: Static checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.10"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24.14.0"

      - name: JS syntax check
        run: node --check script.js

      - name: Static HTML sanity
        run: python scripts/static_sanity.py

      - name: Accessibility/performance sanity
        run: python scripts/accessibility_perf_sanity.py

  # The "API smoke + pytest (advisory)" job was removed when the Python backend
  # moved to s-shahzad/portfolio-backend. It ran src/scripts/api_smoke_test.py
  # and pytest over src/tests, none of which exist in this repo any more. The
  # tests live on and still run in that repository; this one is a static site.
