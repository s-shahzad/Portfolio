[build]
  publish = "."
  command = "echo \"No build step required\""

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    Permissions-Policy = "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=(), interest-cohort=()"
    Cross-Origin-Opener-Policy = "same-origin"
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://www.googletagmanager.com https://www.google-analytics.com; connect-src 'self' https://www.google-analytics.com https://region1.google-analytics.com https://stats.g.doubleclick.net; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; font-src 'self' data: https://fonts.gstatic.com; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'; upgrade-insecure-requests"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

# /assets/* above downgrades everything under it to 1 hour, which caught the
# pinned vendored libraries too — three.module.min.js is 691KB, never changes,
# and was being revalidated hourly by every visitor. Vendored files are
# version-pinned by path, so they are safe to serve immutable. (SHA-155)
[[headers]]
  for = "/assets/vendor/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Detection content is meant to be READ in the browser. Netlify was guessing
# from the extension and getting it wrong, so every "View rule" link silently
# downloaded a file instead of showing it: .spl was served as
# application/x-futuresplash (Flash), .rules and .zeek as
# application/octet-stream, .yml as application/x-yaml. (SHA-131)
[[headers]]
  for = "/detections/*"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
    Content-Disposition = "inline"
    Cache-Control = "public, max-age=3600, must-revalidate"

# /detections/ has an index.html that must stay HTML — the rule above would
# otherwise flatten it to text/plain. More specific paths win in Netlify.
[[headers]]
  for = "/detections/"
  [headers.values]
    Content-Type = "text/html; charset=utf-8"

[[headers]]
  for = "/detections/index.html"
  [headers.values]
    Content-Type = "text/html; charset=utf-8"

# --- Block non-public paths from being served at the public URL ---
# The site publishes the repo root, so anything left here would otherwise be
# fetchable. Each rule returns the 404 page with force=true.
#
# 17 rules were deleted on 2026-08-14 when the Python backend moved to
# s-shahzad/portfolio-backend: /admin*, /src/*, /ops/*, /RUNBOOK.md,
# /render.*, /pytest.ini, /requirements*.txt and the .ps1 wrappers. Those
# files no longer exist in this repo, so the rules guarded nothing.
#
# ⚠ THESE RULES ARE NOT A RELIABLE CONTROL. Netlify matches `from`
# CASE-SENSITIVELY, so /Scripts/foo.ps1 bypasses the /scripts/* rule below
# (verified live 2026-08-14: /Src/server.py returned HTTP 200 while
# /src/server.py returned 404). A denylist cannot be completed by adding
# more rules — the fix is to publish a directory of public assets instead of
# the repo root, at which point this whole block disappears. Tracked in
# SHA-171 / SHA-172. Until then, treat everything in this repo as public.
[[redirects]]
  from = "/scripts/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/logs/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/backups/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/contact_messages/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/data/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/AGENTS.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/package.json"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/package-lock.json"
  to = "/404.html"
  status = 404
  force = true

# Browsers, crawlers, bookmark tools and link-preview bots request /favicon.ico
# by default regardless of any <link rel="icon">. It was 404ing site-wide. (SHA-145)
[[redirects]]
  from = "/favicon.ico"
  to = "/assets/images/assets/logo-alt-c-icon.svg"
  status = 200

[[redirects]]
  from = "/portfolio/*"
  to = "/:splat"
  status = 301

# The /reports/assets/...Resume.pdf -> ...CV.pdf redirect was removed
# 2026-08-14. No CV is published on this site: /reports/ does not exist,
# both sides of that redirect returned 404, and no page links a PDF. The
# rule only pointed one dead URL at another.
