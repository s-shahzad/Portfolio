# Path-based PR labelling.

"content-accuracy":
  - changed-files:
      - any-glob-to-any-file:
          - "index.html"
          - "projects/**"
          - "reports/**"

"security":
  - changed-files:
      - any-glob-to-any-file:
          - "SECURITY.md"
          - "netlify.toml"
          - "robots.txt"
          - ".github/workflows/security.yml"

"ci":
  - changed-files:
      - any-glob-to-any-file:
          - ".github/**"

"dependencies":
  - changed-files:
      - any-glob-to-any-file:
          - "package.json"
          - "package-lock.json"

"design":
  - changed-files:
      - any-glob-to-any-file:
          - "styles.css"
          - "styles.min.css"
          - "assets/**"

"docs":
  - changed-files:
      - any-glob-to-any-file:
          - "*.md"
          - "docs/**"
