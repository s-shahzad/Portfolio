<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Not found — Azhad Shahzad Shaik</title>
    <style>
      :root { color-scheme: light; }
      * { margin: 0; box-sizing: border-box; }
      body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #ffffff;
        color: #111111;
        font-family: ui-monospace, "SFMono-Regular", "Cascadia Code", Menlo, Consolas, monospace;
        padding: 2rem;
      }
      main { max-width: 32rem; text-align: left; }
      .code { font-size: 0.8rem; letter-spacing: 0.2em; text-transform: uppercase; color: #6b6b6b; }
      h1 { font-size: 2rem; margin: 0.75rem 0 1rem; font-weight: 600; }
      p { color: #333333; line-height: 1.6; margin-bottom: 1.5rem; }
      a { color: #111111; text-decoration: underline; text-underline-offset: 3px; }
      a:focus-visible { outline: 2px solid #111111; outline-offset: 3px; }
      /* SHA-140 follow-up: this page is fully self-contained, so the site nav
         gets its rule here rather than from the bundle it does not load. */
      .error-nav { display: flex; flex-wrap: wrap; gap: 0.5rem 1.5rem; justify-content: center; }

      /* SHA-153: this page is fully self-contained (no styles.min.css), so the
         site-wide .skip-link rule never reached it. body is display:flex/centred,
         hence position:fixed rather than absolute — an absolutely positioned skip
         link would be laid out against the centred flex context. */
      .skip-link {
        position: fixed;
        top: -48px;
        left: 0;
        z-index: 100;
        background: #111111;
        color: #ffffff;
        padding: 0.7rem 1.15rem;
        font-size: 0.8rem;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        text-decoration: none;
        transition: top 160ms ease;
      }
      .skip-link:focus { top: 0; color: #ffffff; }
    </style>
    <link rel="icon" href="/assets/images/assets/logo-alt-c-icon.svg" type="image/svg+xml" />
  <link rel="alternate icon" href="/assets/screenshots/assets/logo-alt-c-icon.png" type="image/png" />
</head>
  <body>
    <a class="skip-link" href="#mainContent">Skip to main content</a>
    <main id="mainContent" tabindex="-1">
      <p class="code">404 / not found</p>
      <h1>This page isn't here.</h1>
      <p>The path you requested doesn't exist or isn't public.</p>
      <!-- SHA-140 follow-up: 404.html had exactly one link, back to the root.
           A 404 is where a visitor arrives with a broken link from a search
           result or a citation - handing them a single "go home" and making
           them navigate again is the worst place on the site to be a dead end.
           The same four destinations the other inner pages carry. -->
      <nav class="error-nav" aria-label="Site">
        <a href="/">Home</a>
        <a href="/research/">Research</a>
        <a href="/detections/">Detections</a>
        <a href="/#contact">Contact</a>
      </nav>
    </main>
  </body>
</html>
